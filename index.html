
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atlas AI Research Agent</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b1220;color:#eaf1ff;font-family:Arial,sans-serif}
main{max-width:850px;margin:65px auto;padding:25px}
h1{font-size:42px;margin-bottom:10px}
p{color:#9eacc2;line-height:1.6}
.panel{background:#142238;border:1px solid #293c57;border-radius:16px;padding:22px;margin-top:25px}
textarea{width:100%;height:130px;background:#091525;color:white;border:1px solid #405572;border-radius:10px;padding:14px;font-size:16px}
select{background:#091525;color:white;padding:12px;border:1px solid #405572;border-radius:9px}
button{background:#82b8ff;color:#071426;border:0;padding:14px 22px;border-radius:9px;font-weight:bold;cursor:pointer}
button:disabled{opacity:.5}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:15px}
#output{white-space:pre-wrap;line-height:1.7;overflow-wrap:anywhere}
a{color:#8ebeff}
</style>
</head>
<body>
<main>
<div style="color:#82b8ff;font-weight:bold">✳ ATLAS / AI RESEARCH</div>
<h1>AI Research Agent</h1>
<p>Research any topic using AI. Generate structured reports and discover useful insights.</p>

<div class="panel">
<h3>What would you like to research?</h3>
<textarea id="question" placeholder="Example: Research the future of artificial intelligence in healthcare..."></textarea>

<div class="row">
<select id="depth">
<option value="quick">Quick research</option>
<option value="standard" selected>Detailed research</option>
<option value="deep">Deep research</option>
</select>
<select id="format">
<option value="report">Structured report</option>
<option value="brief">Executive brief</option>
<option value="bullets">Key findings</option>
</select>
</div>

<div class="row">
<button id="run" onclick="research()">Start AI Research ↗</button>
<button onclick="downloadReport()">Download Report</button>
</div>
</div>

<div class="panel">
<h3 id="status">Research results</h3>
<div id="output">Your research report will appear here.</div>
</div>
</main>

<script>
// Replace with your NEW Groq API key.
// WARNING: This exposes the key to anyone who can inspect this page.
const GROQ_API_KEY = "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";

async function research(){
 const question=document.getElementById("question").value.trim();
 const output=document.getElementById("output");
 const status=document.getElementById("status");
 const button=document.getElementById("run");

 if(!question){alert("Enter a research question.");return;}
 if(GROQ_API_KEY==="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"){
 }

 button.disabled=true;
 status.textContent="AI is researching...";
 output.textContent="Generating your research report. Please wait...";

 const depth=document.getElementById("depth").value;
 const format=document.getElementById("format").value;

 const prompt=`
You are Atlas, an AI research analyst.

Research question: ${question}

Research depth: ${depth}
Output format: ${format}

Provide:
1. Executive summary
2. Background and context
3. Key findings
4. Detailed analysis
5. Opportunities and risks
6. Limitations and uncertainties
7. Conclusion
8. Suggested sources and further reading

Be accurate. Never invent citations, URLs, statistics, or research findings.
Clearly distinguish established facts from estimates and opinions.
If you cannot verify something, say so.
`;

 try{
  const response=await fetch(
   "https://api.groq.com/openai/v1/chat/completions",
   {
    method:"POST",
    headers:{
     "Content-Type":"application/json",
     "Authorization":"Bearer "+GROQ_API_KEY
    },
    body:JSON.stringify({
     model:"openai/gpt-oss-120b",
     messages:[
      {role:"system",content:"You are a professional AI research analyst."},
      {role:"user",content:prompt}
     ],
     temperature:0.3,
     max_tokens:4000
    })
   }
  );

  const data=await response.json();

  if(!response.ok){
   throw new Error(data.error?.message||"API request failed: "+response.status);
  }

  const report=data.choices?.[0]?.message?.content;
  if(!report) throw new Error("No report returned.");

  output.textContent=report;
  status.textContent="Research complete ✓";

 }catch(error){
  output.textContent="Error: "+error.message;
  status.textContent="Research failed";
 }finally{
  button.disabled=false;
 }
}

function downloadReport(){
 const content=document.getElementById("output").textContent;
 const blob=new Blob([content],{type:"text/plain;charset=utf-8"});
 const url=URL.createObjectURL(blob);
 const a=document.createElement("a");
 a.href=url;
 a.download="atlas-research-report.txt";
 a.click();
 URL.revokeObjectURL(url);
}
</script>
</body>
</html>
